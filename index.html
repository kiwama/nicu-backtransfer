    --bg:#0F1719; --panel:#162226; --ink:#E4ECEE; --muted:#93A4AA; --line:#28393E;
    --accent:#4FB8C2; --accent-ink:#0B1A1D; --accent-soft:#173338;
    --sea:#0A1114; --land:#1A272B; --land-hi:#1F3A3F; --geo-line:#3D535A;

    --origin:#E4ECEE;
  }
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;padding:0 16px}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 8px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
header.top h1{font-family:var(--latin);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:10px}
header.top h1 .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center;flex:none}
header.top h1 .mark svg{width:16px;height:16px}
header.top .sub{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:7px 8px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
select,input[type="text"],input[type="number"]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:38px}
select:disabled{opacity:.45}
.free{position:relative}
.free input{padding-right:84px}
.free .go{position:absolute;right:4px;top:4px;bottom:4px;border:0;border-radius:5px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:0 14px;cursor:pointer}
.sugg{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:260px;overflow-y:auto}

        <ol class="res" id="res"></ol>
      </section>
    </div>

      <div class="legend" id="legend"></div>
    </div>
  </div>

/* ---------- address index ---------- */
const KNUM = {"〇":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
function kanjiNum(s){ // up to 99
  if(/^[0-9]+$/.test(s)) return +s;
  let n=0, m=s.match(/^([一二三四五六七八九])?十([一二三四五六七八九])?$/);
  if(m) return (m[1]?KNUM[m[1]]:1)*10+(m[2]?KNUM[m[2]]:0);
  if(/^[〇一二三四五六七八九]+$/.test(s)){for(const c of s) n=n*10+KNUM[c]; return n;}
  return NaN;
}
function norm(s){ return normKey(s).replace(/^日本国?/,"").replace(/^神奈川県/,"").replace(/^[^市区町村]{1,4}郡/,""); }
function normKey(s){
  s = (s||"").normalize("NFKC").replace(/\s+/g,"");
  s = s.replace(/ヶ/g,"ケ").replace(/ヵ/g,"カ").replace(/[ｹ]/g,"ケ").replace(/之/g,"之");
  s = s.replace(/[‐‑‒–—―−ー－]/g,m=>"-").replace(/^〒?\d{3}-?\d{4}/,"");
  s = s.replace(/([〇一二三四五六七八九十]+)丁目/g,(m,k)=>{const n=kanjiNum(k);return isNaN(n)?m:n+"丁目";});
  return s;
}
// flatten
const ENTRIES = []; // {city, gun, ward, town, chome, lat, lng, keys:[...]}
function avg(pts){let a=0,b=0;for(const p of pts){a+=p[0];b+=p[1];}return [a/pts.length,b/pts.length];}
const AREA = {}; // centroid for city / city+ward
for(const c of ADDR){
  const wards = c.w ? c.w : [{n:"",t:c.t}];
  const cityPts=[];
  for(const w of wards){
    const wardPts=[];
    for(const [tn,v] of Object.entries(w.t)){
      const base={city:c.n,gun:c.g,ward:w.n,town:tn};
      ENTRIES.push({...base,chome:null,lat:v[0],lng:v[1],nch:v[2]?v[2].length:0});
      wardPts.push([v[0],v[1]]);
      if(v[2]) v[2].forEach((p,i)=>{ if(p) ENTRIES.push({...base,chome:i+1,lat:p[0],lng:p[1]}); });
    }
    if(w.n) AREA[c.n+w.n]=avg(wardPts);
    cityPts.push(...wardPts);
  }
  AREA[c.n]=avg(cityPts);
}
for(const e of ENTRIES){
  const tail = e.town + (e.chome?e.chome+"丁目":"");
  e.keys = [normKey(e.city+e.ward+tail)];
  if(e.ward) e.keys.push(normKey(e.ward+tail));
  e.keys.push(normKey(tail));
  e.label = e.city+e.ward+e.town+(e.chome?e.chome+"丁目":"");
}
const TOWNS = ENTRIES.filter(e=>e.chome===null);

function resolveFree(raw){
  const s = norm(raw);
  if(!s) return {none:true};
  // longest town-level prefix match
  let best=[], bestLen=0, bestRank=9;
  for(const e of TOWNS){
    e.keys.forEach((k,ri)=>{
      if(s.startsWith(k)){
        const rank=ri; // 0 full, 1 ward+town, 2 town only
        if(k.length>bestLen || (k.length===bestLen && rank<bestRank)){best=[e];bestLen=k.length;bestRank=rank;}
        else if(k.length===bestLen && rank===bestRank && !best.includes(e)) best.push(e);
      }
    });
  }
  // a full-address match should beat a longer town-only coincidence; keep as is (length already favours full)
  if(best.length){
    const rest = s.slice(bestLen);
    const pick = e => {
      if(e.nch){
        const m = rest.match(/^(\d+)(丁目|-|番|$)/);
        if(m){ const n=+m[1]; const hit=ENTRIES.find(x=>x.city===e.city&&x.ward===e.ward&&x.town===e.town&&x.chome===n); if(hit) return {entry:hit,prec:"丁目"}; }
      }
      return {entry:e,prec:"町"};
    };
    if(best.length===1) return pick(best[0]);
    return {multi:best.slice(0,12).map(e=>pick(e).entry)};
  }
  // city / ward only
  for(const c of ADDR){
    const cn=normKey(c.n);
    if(s.startsWith(cn)){
      const r=s.slice(cn.length);
      if(c.w) for(const w of c.w){ if(r.startsWith(normKey(w.n))) return {area:{city:c.n,ward:w.n,label:c.n+w.n,lat:AREA[c.n+w.n][0],lng:AREA[c.n+w.n][1]},prec:"区"}; }
      return {area:{city:c.n,ward:"",label:c.n,lat:AREA[c.n][0],lng:AREA[c.n][1]},prec:"市区町村"};
    }
  }
  const sug = suggest(raw);
  return sug.length ? {multi:sug} : {none:true};
}
function suggest(raw,limit=10){
  const s = norm(raw); if(s.length<1) return [];
  const out=[], seen=new Set();
  const push=e=>{if(!seen.has(e.label)){seen.add(e.label);out.push(e);}};
  for(const e of TOWNS){ if(e.keys.some(k=>k.startsWith(s))) push(e); if(out.length>=limit) return out; }
  for(const e of TOWNS){ if(e.keys[0].includes(s)) push(e); if(out.length>=limit) return out; }
  // prefix of input matches a town and input continues (e.g. chome typed)
  const r = resolvePrefixOnly(s); r.forEach(push);
  return out.slice(0,limit);
}
function resolvePrefixOnly(s){
  const out=[]; for(const e of ENTRIES){ if(e.keys.some(k=>s.startsWith(k)&&k.length>1)) out.push(e); }
  return out.sort((a,b)=>b.keys[0].length-a.keys[0].length).slice(0,5);
}

/* ---------- state ---------- */
const state = { all:false, origin:null, levels:new Set(["基幹","中核","協力","県外"]) };

function hav(a,b,c,d){const R=6371,t=Math.PI/180;const x=Math.sin((c-a)*t/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function meets(h,wk,g){
  if(h.level==="県外") return {ok:true, okW:true, okG:true, unknown: wk!=null||g!=null};
  const okW = wk==null || h.minW==null || wk>=h.minW;
  const okG = g==null || h.minG==null || g>=h.minG;
  return {ok:okW&&okG, okW, okG};
}

/* ---------- select cascade ---------- */
const sCity=$("s-city"), sWard=$("s-ward"), sTown=$("s-town"), sCh=$("s-chome");
function opt(sel,items,ph){sel.innerHTML=`<option value="">${ph}</option>`+items.map(i=>`<option value="${esc(i.v)}">${esc(i.l)}</option>`).join("");}
opt(sCity, ADDR.map(c=>({v:c.n,l:(c.g?c.g+" ":"")+c.n})), "選択してください");
function cityObj(){return ADDR.find(c=>c.n===sCity.value);}
function townTable(){const c=cityObj(); if(!c) return null; if(c.w){const w=c.w.find(w=>w.n===sWard.value); return w?w.t:null;} return c.t;}
function fillWard(){const c=cityObj(); if(c&&c.w){opt(sWard,c.w.map(w=>({v:w.n,l:w.n})),"区を選択");sWard.disabled=false;} else {opt(sWard,[],c?"（区なし）":"—");sWard.disabled=true;}}
function fillTown(){const t=townTable(); if(t){opt(sTown,Object.keys(t).map(n=>({v:n,l:n})),"町・大字を選択");sTown.disabled=false;} else {opt(sTown,[],"—");sTown.disabled=true;}}
function fillChome(){const t=townTable(); const v=t&&t[sTown.value]; if(v&&v[2]){const items=[];v[2].forEach((p,i)=>{if(p)items.push({v:String(i+1),l:(i+1)+"丁目"});});opt(sCh,items,"指定なし");sCh.disabled=false;} else {opt(sCh,[],v?"（丁目なし）":"—");sCh.disabled=true;}}
function fromSelects(){
  const c=cityObj(); if(!c){setOrigin(null);return;}
  const t=townTable();
  if(t && sTown.value){
    const v=t[sTown.value]; const ch=sCh.value?+sCh.value:null;
    const p = ch && v[2] && v[2][ch-1] ? v[2][ch-1] : v;
    setOrigin({lat:p[0],lng:p[1],label:c.n+sWard.value+sTown.value+(ch?ch+"丁目":""),prec:ch?"丁目":"町"});
  } else if(c.w && sWard.value){
    const a=AREA[c.n+sWard.value]; setOrigin({lat:a[0],lng:a[1],label:c.n+sWard.value,prec:"区"});
  } else {
    const a=AREA[c.n]; setOrigin({lat:a[0],lng:a[1],label:c.n,prec:"市区町村"});
  }
}
sCity.addEventListener("change",()=>{fillWard();fillTown();fillChome();fromSelects();});
sWard.addEventListener("change",()=>{fillTown();fillChome();fromSelects();});
sTown.addEventListener("change",()=>{fillChome();fromSelects();});
sCh.addEventListener("change",fromSelects);
function syncSelects(e){ // e: entry or area
  sCity.value=e.city; fillWard(); if(e.ward){sWard.value=e.ward;} fillTown();
  if(e.town){sTown.value=e.town;} fillChome(); if(e.chome){sCh.value=String(e.chome);}
}

/* ---------- free input ---------- */
const fin=$("free-in"), sugg=$("sugg"); let sugItems=[], sugIdx=-1;
function showSugg(items){
  sugItems=items; sugIdx=-1;
  if(!items.length){sugg.hidden=true;sugg.innerHTML="";return;}
  sugg.innerHTML=items.map((e,i)=>`<li><button type="button" data-i="${i}">${esc(e.label)}${e.gun?` <small>${esc(e.gun)}</small>`:""}</button></li>`).join("");
  sugg.hidden=false;
}
sugg.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;pickEntry(sugItems[+b.dataset.i]);});
function pickEntry(e){
  fin.value=e.label; sugg.hidden=true;
  setOrigin({lat:e.lat,lng:e.lng,label:e.label,prec:e.chome?"丁目":"町"}); syncSelects(e);
}
fin.addEventListener("input",()=>showSugg(suggest(fin.value,8)));
fin.addEventListener("keydown",ev=>{
  if(sugg.hidden) return;
  const bs=[...sugg.querySelectorAll("button")];
  if(ev.key==="ArrowDown"){ev.preventDefault();sugIdx=Math.min(sugIdx+1,bs.length-1);}
  else if(ev.key==="ArrowUp"){ev.preventDefault();sugIdx=Math.max(sugIdx-1,0);}
  else if(ev.key==="Enter" && sugIdx>=0){ev.preventDefault();pickEntry(sugItems[sugIdx]);return;}
  else if(ev.key==="Escape"){sugg.hidden=true;return;} else return;
  bs.forEach((b,i)=>b.classList.toggle("active",i===sugIdx));
});
$("free-form").addEventListener("submit",ev=>{
  ev.preventDefault();
  const r=resolveFree(fin.value);
  if(r.entry){ sugg.hidden=true; setOrigin({lat:r.entry.lat,lng:r.entry.lng,label:r.entry.label,prec:r.prec}); syncSelects(r.entry); }
  else if(r.area){ sugg.hidden=true; setOrigin({...r.area,prec:r.prec}); syncSelects(r.area); }
  else if(r.multi){ showSugg(r.multi); showOriginMsg("候補が複数あります。下の一覧から選んでください。"); }
  else { sugg.hidden=true; showOriginMsg("神奈川県内の住所として見つかりませんでした。市区町村名から入力するか、「選択して入力」をお試しください。"); }
});

$("chips").addEventListener("click",ev=>{const b=ev.target.closest(".chip");if(!b)return;const k=b.dataset.k;const on=b.getAttribute("aria-pressed")==="true";if(on&&state.levels.size===1)return;b.setAttribute("aria-pressed",!on);on?state.levels.delete(k):state.levels.add(k);render();});
["f-wk","f-g","f-hide"].forEach(id=>$(id).addEventListener("input",render));
[["v-10",false],["v-all",true]].forEach(([id,v])=>$(id).addEventListener("click",()=>{state.all=v;$("v-10").setAttribute("aria-pressed",!v);$("v-all").setAttribute("aria-pressed",v);render(false);}));
$("legend").innerHTML = LEVELS.map(l=>`<span><i style="background:var(${l.v})"></i>${l.k}</span>`).join("")+`<span><i style="background:var(--origin)"></i>検索地点</span><span>番号＝近い順</span>`;

/* ---------- origin + render ---------- */
function showOriginMsg(msg){ $("origin").className="origin err"; $("origin").innerHTML=`<span class="dot"></span><div>${esc(msg)}</div>`; }
function setOrigin(o){ state.origin=o; render(true); }
function numOrNull(id){const v=$(id).value.trim(); return v===""?null:+v;}

function render(refit){
  const o=state.origin;
  const og=$("origin");
  if(!o){ og.className="origin"; og.innerHTML=`<span class="dot"></span><div>住所を選ぶと、近い施設を表示します。</div>`; }
  else if(!o.msg){ og.className="origin"; og.innerHTML=`<span class="dot"></span><div><b>${esc(o.label)}</b><div class="prec">${o.prec==="地図"?"地図で指定した地点":o.prec+"の代表点から計算"} ・ ${o.lat.toFixed(4)}, ${o.lng.toFixed(4)}</div></div>`; }
  const wk=numOrNull("f-wk"), g=numOrNull("f-g"), hide=$("f-hide").checked;
  let list = HOSP.map(h=>({...h, d:o?hav(o.lat,o.lng,h.lat,h.lng):null, m:meets(h,wk,g)}));
  list = list.filter(h=>state.levels.has(h.level));
  if(o) list.sort((a,b)=>a.d-b.d);
  const cand = hide ? list.filter(h=>h.m.ok) : list;
  const shown = state.all ? cand : cand.slice(0,10);
  const nOut = list.length - list.filter(h=>h.m.ok).length;
  $("count").textContent = (state.all?`${cand.length}施設`:`上位${shown.length}件 / 該当${cand.length}施設`) + (wk!=null||g!=null ? `（条件外 ${nOut}）` : "");
  const res=$("res");
  if(!shown.length){res.innerHTML=`<li class="empty">条件に合う施設がありません。週数・体重の条件や施設区分を見直してください。</li>`;}
  else res.innerHTML = shown.map((h,i)=>{
    const col=`var(${LEVELS.find(l=>l.k===h.level).v})`;
    const dir = `https://www.google.com/maps/dir/?api=1${o?`&origin=${o.lat},${o.lng}`:""}&destination=${encodeURIComponent(h.name+" "+h.addr)}`;
    const ext = h.level==="県外";
    const wkTxt = ext?"情報なし":h.weeks==="制限なし"?"制限なし":h.minW+"週以上";
    const gTxt = ext?"情報なし":h.weight==="制限なし"?"制限なし":h.minG+"g以上";
    return `<li class="${h.m.ok?"":"out"}">
      <span class="rank" style="background:${col}">${o?i+1:"–"}</span>
      <button class="hname" data-name="${esc(h.name)}">${esc(h.name)}</button>
      <span class="dist">${o?h.d.toFixed(1)+"<small>km</small>":""}</span>
      <div class="meta"><span class="lvl" style="color:${col}">${h.level}</span><span>${esc(h.region)}</span>
        <span class="crit">週数 <b>${wkTxt}</b> 体重 <b>${gTxt}</b></span>
        ${h.m.unknown?`<span class="tag-out">基準は要確認</span>`:""}
        ${h.m.ok?"":`<span class="tag-out">${!h.m.okW&&!h.m.okG?"週数・体重":!h.m.okW?"週数":"体重"}が基準外</span>`}</div>
      <div class="actions"><span class="tel">${h.tel}</span>
        <button type="button" class="btn-s" data-copy="${h.tel}">番号をコピー</button>
        <a class="btn-s" href="${dir}&travelmode=driving" target="_blank" rel="noopener">車の経路</a>
        <a class="btn-s" href="${dir}&travelmode=transit" target="_blank" rel="noopener">電車の経路</a></div>
    </li>`;}).join("");
  drawMap(shown, list, refit);
}
$("res").addEventListener("click",ev=>{
  const c=ev.target.closest("[data-copy]");
  if(c){const t=c.dataset.copy; const done=()=>{c.textContent="コピーしました";setTimeout(()=>c.textContent="番号をコピー",1500);};
    try{navigator.clipboard.writeText(t).then(done,()=>selectTel(c));}catch(e){selectTel(c);} return;}
  const n=ev.target.closest(".hname"); if(n) focusHosp(n.dataset.name);
});
function selectTel(btn){const el=btn.parentElement.querySelector(".tel");const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="選択しました";setTimeout(()=>btn.textContent="番号をコピー",1500);}

/* ---------- map ---------- */
let map=null, geoLayer=null, hospLayer=null, originLayer=null, markerByName={};
const landOf=f=>cssv(f&&f.properties.p==="13"?"--land-out":"--land");
function geoStyle(f){return {color:cssv("--geo-line"),weight:1,fillColor:landOf(f),fillOpacity:1};}
function initMap(){
  if(typeof L==="undefined"){ $("map").innerHTML=`<div class="maperr">地図ライブラリを読み込めませんでした。一覧は引き続き利用できます。</div>`; return; }
  map=L.map("map",{zoomSnap:.25,attributionControl:false,minZoom:8,maxZoom:15,maxBounds:[[34.9,138.6],[35.9,140.1]]});
  geoLayer=L.geoJSON(GEO,{style:geoStyle,onEachFeature:(f,l)=>{
    l.bindTooltip(f.properties.n,{sticky:true,direction:"top",opacity:.95});
    l.on("mouseover",()=>l.setStyle({fillColor:cssv("--land-hi")})); l.on("mouseout",()=>l.setStyle({fillColor:landOf(f)}));
  }}).addTo(map);
  map.fitBounds(L.geoJSON({type:"FeatureCollection",features:GEO.features.filter(f=>f.properties.p==="14")}).getBounds(),{padding:[10,10]});
  const labelLayer=L.layerGroup();
  GEO.features.forEach(f=>{ const n=f.properties.n; const c=AREA[n]||(f.properties.c); if(!c) return;
    L.marker(c,{icon:L.divIcon({className:"ml",html:`<span>${esc(n.replace(/^(横浜市|川崎市|相模原市)(?=.+区$)/,""))}</span>`,iconSize:[0,0]}),interactive:false,keyboard:false}).addTo(labelLayer); });
  const syncLabels=()=>{ if(map.getZoom()>=10.5) labelLayer.addTo(map); else labelLayer.remove(); };
  map.on("zoomend",syncLabels); syncLabels();
  hospLayer=L.layerGroup().addTo(map); originLayer=L.layerGroup().addTo(map);
  map.on("click",ev=>{ const {lat,lng}=ev.latlng; const near=nearestTown(lat,lng);
    setOrigin({lat,lng,label:near?near.label+" 付近":"地図上の地点",prec:"地図"}); });
  const reStyle=()=>{geoLayer.setStyle(geoStyle); render(false);};
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",reStyle);}catch(e){}
  new MutationObserver(reStyle).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
}
function nearestTown(lat,lng){let b=null,bd=1e9;for(const e of ENTRIES){const d=(e.lat-lat)**2+((e.lng-lng)*.82)**2;if(d<bd){bd=d;b=e;}}return bd<0.0004?b:null;}
function popupHTML(h,o){
  return `<b>${esc(h.name)}</b><br>${h.level}・${esc(h.region)}${o?` ・ <span style="font-family:var(--mono)">${h.d.toFixed(1)} km</span>`:""}<br>${h.level==="県外"?"週数・体重 情報なし":`週数 ${esc(h.weeks)} / 体重 ${esc(h.weight)}`}<br><span style="font-family:var(--mono)">${h.tel}</span>`;
}
function drawMap(shown, all, refit){
  if(!map) return;
  hospLayer.clearLayers(); originLayer.clearLayers(); markerByName={};
  const o=state.origin; const rankOf={}; shown.forEach((h,i)=>rankOf[h.name]=i+1);
  const top = o ? shown.slice(0,3) : [];
  if(o){
    const lc=cssv("--origin");
    top.forEach(h=>L.polyline([[o.lat,o.lng],[h.lat,h.lng]],{color:lc,weight:1.5,dashArray:"4 5",opacity:.7,interactive:false}).addTo(originLayer));
    L.marker([o.lat,o.lng],{icon:L.divIcon({className:"",html:`<div class="om"></div>`,iconSize:[18,18],iconAnchor:[9,9]}),keyboard:false,zIndexOffset:1000}).bindTooltip(o.label).addTo(originLayer);
  }
  // draw out-of-criteria dim first, then shown in reverse rank so #1 is on top
  const shownSet=new Set(shown.map(h=>h.name));
  [...shown].reverse().forEach(h=>addHosp(h,o?rankOf[h.name]:null,!h.m.ok,o));
  if(o && refit){
    const pts=[[o.lat,o.lng],...top.map(h=>[h.lat,h.lng])];
    map.flyToBounds(L.latLngBounds(pts),{padding:[50,50],maxZoom:12,duration:.6});
  }
}
function addHosp(h,rank,dim,o){
  const col=lvColor(h.level); const big = rank!=null && rank<=10;
  const html = `<div class="hm ${big?"":"small"} ${dim?"dim":""}" style="background:${col}">${big?rank:""}</div>`;
  const sz = big?22:13;
  const m=L.marker([h.lat,h.lng],{icon:L.divIcon({className:"",html,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]}),title:h.name,zIndexOffset:big?(100-rank)*10:0})
    .bindPopup(popupHTML(h,o)).addTo(hospLayer);
  if(rank!=null && rank<=3 && !dim) m.bindTooltip(h.name,{permanent:true,direction:"right",offset:[12,0],className:"hl"});
  markerByName[h.name]=m;
}
function focusHosp(name){ const m=markerByName[name]; if(!map||!m) return; map.flyTo(m.getLatLng(),Math.max(map.getZoom(),12),{duration:.5}); setTimeout(()=>m.openPopup(),520);
  if(matchMedia("(max-width:900px)").matches) $("map").scrollIntoView({behavior:"smooth",block:"center"}); }

/* ---------- boot with an example ---------- */
initMap();
(function(){
  const ex = ENTRIES.find(e=>e.city==="横浜市"&&e.ward==="金沢区"&&e.town==="瀬戸"&&e.chome===null) || ENTRIES[0];
  syncSelects(ex);
  state.origin={lat:ex.lat,lng:ex.lng,label:ex.label+"（例）",prec:"町"};
  render(true);
})();
</script>
